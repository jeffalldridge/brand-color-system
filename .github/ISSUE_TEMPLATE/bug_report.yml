name: Bug report
description: Something isn't working the way you expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: browser
    attributes:
      label: Browser + version
      description: e.g. "Safari 17.4", "Chrome 122", "Firefox 124"
      placeholder: Safari 17.4
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - iPadOS
        - Android
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Click "Add color"
        3. ...
        4. App freezes
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or screen recording
      description: Drag-drop here. Optional but very helpful.
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: Open DevTools → Console → paste anything red.
      render: text
    validations:
      required: false
